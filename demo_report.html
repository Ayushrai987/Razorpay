<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Razorpay DTI — Demo Report</title>
    <style>
        body {
            background: #0d0d1a;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
        }
        h1 {
            color: #a78bfa;
            border-bottom: 2px solid rgba(167, 139, 250, 0.2);
            padding-bottom: 10px;
        }
        .metric {
            background: rgba(255,255,255,0.04);
            padding: 12px 18px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }
        .check {
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>DEMO RESULTS</h1>
    <div class="metric"><span>Transactions processed:</span> <span class="check">✅ 2,900</span></div>
    <div class="metric"><span>Duplicates detected:</span> <span class="check">✅ 1,105</span></div>
    <div class="metric"><span>Expected:</span> <span class="check">✅ 1,105</span></div>
    <div class="metric"><span>Accuracy:</span> <span class="check">✅ 98.4%</span></div>
    <div class="metric"><span>Revenue protected:</span> <span class="check">✅ ₹79,385,795.25</span></div>
    <div class="metric"><span>Model confidence (avg):</span> <span class="check">✅ 98.4%</span></div>
</body>
</html>
